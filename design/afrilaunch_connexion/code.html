<style>

            background-color: theme('colors.background');

<body class="bg-dot-pattern min-h-screen flex items-center justify-center p-container-margin-mobile md:p-container-margin-desktop font-body-md text-on-background">
<!-- Nav shell is suppressed for linear/transactional page (Login) -->
<main class="w-full max-w-md">
<!-- Logo Section -->
<div class="text-center mb-8">
<h1 class="font-headline-lg md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
                AfriLaunch
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Bienvenue. Connectez-vous à votre espace.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-white rounded-xl shadow-[0_2px_4px_rgba(0,0,0,0.05),0_0_12px_rgba(0,0,0,0.05)] p-6 md:p-8">
<form action="#" class="space-y-6" method="POST">
<!-- Email Field -->
<div class="space-y-1">
<label class="block font-label-md text-label-md text-on-surface" for="email">Adresse Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 border border-surface-variant rounded-lg bg-surface text-on-surface focus:outline-none input-emerald transition-colors min-h-[48px] font-body-md text-body-md" id="email" name="email" placeholder="nom@entreprise.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-1">
<div class="flex items-center justify-between">
<label class="block font-label-md text-label-md text-on-surface" for="password">Mot de passe</label>
<a class="font-label-sm text-label-sm text-primary hover:text-innovation-amber transition-colors" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 border border-surface-variant rounded-lg bg-surface text-on-surface focus:outline-none input-emerald transition-colors min-h-[48px] font-body-md text-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Afficher le mot de passe" class="absolute inset-y-0 right-0 pr-3 flex items-center text-outline hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center gap-2 bg-primary hover:bg-surface-tint text-on-primary font-label-md text-label-md rounded-lg py-3 min-h-[48px] shadow-sm transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary" type="submit">
<span class="material-symbols-outlined text-xl">login</span>
                    Se connecter
                </button>
</form>
<!-- Divider -->
<div class="mt-8 mb-6 relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-white font-label-sm text-label-sm text-outline">Ou continuer avec</span>
</div>
</div>
<!-- Google Auth Button -->
<button class="w-full flex justify-center items-center gap-3 bg-surface-white border border-surface-variant hover:bg-surface-container-low text-on-surface font-label-md text-label-md rounded-lg py-3 min-h-[48px] transition-colors focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-surface-variant" type="button">

<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>

</svg>
                Google
            </button>
