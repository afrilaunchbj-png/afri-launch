<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inscription - AfriLaunch</title>
<!-- Google Fonts & Material Symbols -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Lexend:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        /* Custom Checkbox Style for Deep Emerald */
        .emerald-checkbox:checked {
            background-color: #064e3b; /* primary-container */
            border-color: #064e3b;
        }
        .emerald-checkbox:focus {
            --tw-ring-color: #95d3ba; /* inverse-primary */
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#4f1f19",
                        "error": "#ba1a1a",
                        "on-background": "#191c1d",
                        "outline-variant": "#bfc9c3",
                        "surface": "#f8f9fa",
                        "surface-dim": "#d9dadb",
                        "on-surface": "#191c1d",
                        "surface-container-low": "#f3f4f5",
                        "inverse-primary": "#95d3ba",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed-variant": "#653e00",
                        "innovation-amber": "#D97706",
                        "on-primary": "#ffffff",
                        "background": "#f8f9fa",
                        "surface-bright": "#f8f9fa",
                        "primary-container": "#064e3b",
                        "on-primary-container": "#80bea6",
                        "surface-container-high": "#e7e8e9",
                        "success-emerald": "#059669",
                        "inverse-surface": "#2e3132",
                        "surface-white": "#FFFFFF",
                        "tertiary-fixed-dim": "#ffb4a9",
                        "on-surface-variant": "#404944",
                        "primary-fixed": "#b0f0d6",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-container": "#edeeef",
                        "error-container": "#ffdad6",
                        "on-primary-fixed": "#002117",
                        "on-tertiary-fixed-variant": "#6e372f",
                        "secondary": "#855300",
                        "on-tertiary-fixed": "#380d08",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#ffb95f",
                        "on-error": "#ffffff",
                        "on-secondary-container": "#684000",
                        "secondary-container": "#fea619",
                        "on-primary-fixed-variant": "#0b513d",
                        "surface-tint": "#2b6954",
                        "surface-variant": "#e1e3e4",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#ffddb8",
                        "outline": "#707974",
                        "primary": "#003527",
                        "primary-fixed-dim": "#95d3ba",
                        "tertiary-fixed": "#ffdad5",
                        "on-tertiary-container": "#ea9e93",
                        "on-secondary-fixed": "#2a1700",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e1e3e4",
                        "text-rich-black": "#111827",
                        "tertiary-container": "#6b342d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-margin-mobile": "16px",
                        "touch-target-min": "48px",
                        "base": "8px",
                        "container-margin-desktop": "40px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Lexend"],
                        "headline-lg-mobile": ["Lexend"],
                        "label-sm": ["Inter"],
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Lexend"],
                        "display-lg": ["Lexend"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-surface antialiased">
<!-- Note: TopAppBar and BottomNavBar are suppressed as this is a transactional (Sign-up) screen per the mandate -->
<main class="flex-grow flex items-center justify-center p-container-margin-mobile md:p-container-margin-desktop">
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_2px_4px_rgba(0,0,0,0.05),0_0_12px_rgba(0,0,0,0.02)] p-6 md:p-8 relative overflow-hidden">
<!-- Decorative accent (Amber Ledger) -->
<div class="absolute top-0 left-0 w-full h-1 bg-innovation-amber"></div>
<div class="text-center mb-8">
<h1 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary mb-2">AfriLaunch</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Créez votre compte pour commencer.</p>
</div>
<form action="#" class="space-y-5" method="POST">
<!-- Full Name Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="fullName">Nom complet</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 20px;">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 h-touch-target-min border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-colors shadow-sm" id="fullName" name="fullName" placeholder="John Doe" required="" type="text"/>
</div>
</div>
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 20px;">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-3 h-touch-target-min border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-colors shadow-sm" id="email" name="email" placeholder="nom@entreprise.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-1" for="password">Mot de passe</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" style="font-size: 20px;">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-3 h-touch-target-min border border-outline-variant rounded-lg bg-surface-container-lowest text-on-surface font-body-md focus:ring-1 focus:ring-primary-container focus:border-primary-container transition-colors shadow-sm" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined" style="font-size: 20px;">visibility_off</span>
</button>
</div>
<p class="mt-1 font-label-sm text-label-sm text-on-surface-variant">Doit contenir au moins 8 caractères.</p>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start mt-4">
<div class="flex items-center h-5">
<input class="emerald-checkbox h-4 w-4 rounded border-outline-variant text-primary-container focus:ring-primary-container transition-colors mt-1" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="ml-3 text-sm">
<label class="font-body-md text-body-md text-on-surface-variant" for="terms">
                            J'accepte les <a class="text-primary hover:underline font-label-md" href="#">conditions d'utilisation</a> et la <a class="text-primary hover:underline font-label-md" href="#">politique de confidentialité</a>.
                        </label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center h-touch-target-min px-4 py-3 border border-transparent text-label-md font-label-md rounded-lg text-on-primary bg-primary-container hover:bg-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-container transition-colors shadow-sm" type="submit">
                    Créer un compte
                </button>
</form>
<!-- Divider -->
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest font-label-sm text-label-sm text-on-surface-variant">
                            Ou continuer avec
                        </span>
</div>
</div>
<!-- Google Auth Button -->
<div class="mt-6">
<button class="w-full flex justify-center items-center h-touch-target-min px-4 py-3 border border-outline-variant rounded-lg shadow-sm bg-surface-container-lowest text-label-md font-label-md text-on-surface hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="button">
<!-- Simplified Google G placeholder icon since specific brand icons might not be in Material Symbols natively, using generic 'login' if needed, but for "Google Auth" a colored SVG is typical. Using a standard symbol for simplicity as per instructions to use material symbols. -->
<span class="material-symbols-outlined mr-2 text-on-surface-variant">account_circle</span>
                        Google
                    </button>
</div>
</div>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Vous avez déjà un compte ? 
                    <a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Se connecter</a>
</p>
</div>
</div>
</main>
</body></html>
