version: "2"
sql:
  - engine: "postgresql"
    queries: "db/query"
    schema: "db/migrations"
    gen:
      go:
        package: "db"
        out: "internal/infra/postgres/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type:
              type: "string"
          - db_type: "timestamptz"
            go_type:
              type: "time.Time"
          - db_type: "timestamp"
            go_type:
              type: "time.Time"
          - db_type: "jsonb"
            go_type:
              type: "[]byte"
